spring.application.name=orders-service

spring.grpc.server.port=${GRPC_PORT:50052}
spring.grpc.client.channel.catalog.target=${CATALOG_GRPC_TARGET:localhost:50051}
spring.grpc.client.channel.catalog.default.deadline=3s

# Defaults match .env.example and docker-compose.yml for local development.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${POSTGRES_USER:tcg}
spring.datasource.password=${POSTGRES_PASSWORD:tcg}
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://tcg:tcg@localhost:5672}
spring.rabbitmq.publisher-confirm-type=simple

orders.payment.limit-cents=${PAYMENT_LIMIT_CENTS:20000}
orders.outbox.poll-interval=500ms
